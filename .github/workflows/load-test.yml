name: Locust Load Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
#   schedule:
#     # Chạy test vào lúc 9 sáng thứ 2-6 (định kỳ)
#     - cron: '0 9 * * 1-5'

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Locust tests (Headless mode)
      run: |
        locust -f locustfile.py \
          --host=http://localhost:8000 \
          --users=10 \
          --spawn-rate=2 \
          --run-time=1m \
          --headless \
          --csv=results \
          --csv-prefix="" || true
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: locust-results-py${{ matrix.python-version }}
        path: results*.csv
        retention-days: 30
    
    - name: Generate report
      if: always()
      run: |
        if [ -f "results_stats.csv" ]; then
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat results_stats.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint
    
    - name: Lint with flake8
      run: |
        # Cảnh báo lỗi cú pháp hoặc undefined names
        flake8 locustfile.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 locustfile.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
